<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Min första sida</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      padding: 2rem;
      text-align: center;
    }

    .photo {
      display: inline-block;
      overflow: hidden;
    }

    img#myImage {
      width: 300px;
      height: auto;
      transition: transform 0.3s ease;
      display: block;
    }

    img#myImage.large {
      transform: scale(1.8);
    }

    button#toggleSize {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Min första sida</h1>
  <p>Välkommen hit</p>

  <div class="photo">
    <img id="myImage" src="min bild.jpg" alt="Ett foto" />
  </div>

  <div>
    <button id="toggleSize" aria-pressed="false">Gör bilden större</button>
  </div>

  <script>
    const btn = document.getElementById('toggleSize');
    const img = document.getElementById('myImage');

    btn.addEventListener('click', () => {
      const isLarge = img.classList.toggle('large');
      // Update button text and accessibility state
      btn.textContent = isLarge ? 'Återställ storlek' : 'Gör bilden större';
      btn.setAttribute('aria-pressed', String(isLarge));
    });
  </script>
</body>
</html>
