<h1>Min första sida</h1> <p>Välkommen hit</p> <img src="min bild.jpg" width="300"> 
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Min första sida</title>
  <style>
    :root{
      --ui-bg:#fff;
      --ui-ink:#111;
      --accent:#0b76d1;
      --joy-size:120px;
    }
    html,body{height:100%;margin:0;background:var(--ui-bg);color:var(--ui-ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;padding:1rem;box-sizing:border-box}
    main{max-width:1100px;margin:0 auto;text-align:center}
    h1{margin:0 0 .25rem}
    p{margin:0 1rem 1rem;color:#444}

    /* Photo area */
    .viewer{
      position:relative;
      width:100%;
      height:60vh;
      max-height:720px;
      background:#e9eef5;
      border-radius:8px;
      overflow:hidden;
      margin:1rem 0;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action: none; /* allow custom pointer handling */
    }
    .photo-inner{
      will-change: transform;
      touch-action: none;
      user-select: none;
      cursor: grab;
      display:inline-block;
    }
    .photo-inner:active{cursor:grabbing}

    img#myImage{
      display:block;
      max-width:none; /* we control size via natural size + transform */
      max-height:none;
      width:auto;
      height:auto;
      transform-origin:center center;
      -webkit-user-drag: none;
    }

    /* Controls */
    .controls{
      display:flex;
      gap:.5rem;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:.5rem;
    }
    button.control{
      border:1px solid #d0d7df;
      background:#fff;
      padding:.5rem .75rem;
      border-radius:6px;
      cursor:pointer;
      font-size:1rem;
    }
    button.control:active{transform: translateY(1px)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* Joystick */
    .joystick{
      position:absolute;
      right:1rem;
      bottom:1rem;
      width:var(--joy-size);
      height:var(--joy-size);
      background:rgba(0,0,0,0.06);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      touch-action:none;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      user-select:none;
    }
    .joystick-knob{
      width:46%;
      height:46%;
      background:linear-gradient(180deg,#fff,#f6f6f6);
      border-radius:50%;
      border:2px solid rgba(0,0,0,0.12);
      transform:translate(0,0);
      transition: transform .06s linear;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12) inset;
      touch-action:none;
    }

    @media (prefers-reduced-motion: reduce){
      .joystick-knob{transition:none}
    }

    footer{margin-top:1rem;font-size:.9rem;color:#555}
  </style>
</head>
<body>
  <main>
    <h1>Min första sida</h1>
    <p>Välkommen hit — tryck för att zooma, dra för att panorera eller använd joystick när du är inzoomad.</p>

    <div class="viewer" id="viewer" aria-label="Bildvisare">
      <div class="photo-inner" id="photoInner" role="group" aria-label="Bild">
        <!-- Replace "min-bild.jpg" with your actual filename -->
        <img id="myImage" src="min-bild.jpg" alt="Ett foto av en bil" draggable="false" />
      </div>

      <div class="joystick" id="joystick" role="application" aria-label="Joystick för panorering" title="Joystick för panorering">
        <div class="joystick-knob" id="knob" aria-hidden="true"></div>
      </div>
    </div>

    <div class="controls" role="toolbar" aria-label="Bildkontroller">
      <button class="control" id="zoomOut" aria-label="Zooma ut">−</button>
      <button class="control" id="reset" aria-label="Återställ">Återställ</button>
      <button class="control" id="zoomIn" aria-label="Zooma in">+</button>
      <button class="control" id="toggleFit" aria-pressed="false" aria-label="Fälla bilden till fönster">Fit</button>
    </div>

    <footer>
      Tips: Använd piltangenter för att panorera, +/− för att zooma och R för att återställa.
    </footer>
  </main>

  <script>
    (function(){
      const img = document.getElementById('myImage');
      const photoInner = document.getElementById('photoInner');
      const viewer = document.getElementById('viewer');
      const zoomInBtn = document.getElementById('zoomIn');
      const zoomOutBtn = document.getElementById('zoomOut');
      const resetBtn = document.getElementById('reset');
      const toggleFitBtn = document.getElementById('toggleFit');
      const joystick = document.getElementById('joystick');
      const knob = document.getElementById('knob');

      // Settings
      const MIN_SCALE = 1;
      const MAX_SCALE = 3;
      const ZOOM_STEP = 0.2;
      const JOY_SPEED = 6; // pixels per frame base speed (scaled by zoom)
      const KEY_PAN_STEP = 30; // px per keypress

      let scale = 1;
      let pan = {x:0, y:0}; // px
      let imgNatural = {w:0,h:0};
      let containerSize = {w:0,h:0};
      let dragging = false;
      let dragStart = {x:0,y:0,panX:0,panY:0};
      let fitToViewer = false;

      // joystick state
      let joyActive = false;
      let joyVec = {x:0,y:0};
      let raf = null;

      // Utility
      function clamp(v,min,max){ return Math.max(min, Math.min(max, v)) }

      function updateContainerSize(){
        const r = viewer.getBoundingClientRect();
        containerSize.w = r.width;
        containerSize.h = r.height;
      }

      function updateNaturalSize(){
        imgNatural.w = img.naturalWidth || img.width;
        imgNatural.h = img.naturalHeight || img.height;
      }

      function maxPanForScale(s){
        // compute scaled size, and allowed pan range so image covers viewer
        const scaledW = imgNatural.w * s;
        const scaledH = imgNatural.h * s;

        // if scaled smaller than container, center -> no pan allowed
        const maxX = Math.max(0, (scaledW - containerSize.w) / 2);
        const maxY = Math.max(0, (scaledH - containerSize.h) / 2);
        return {x: maxX, y: maxY};
      }

      function applyTransform(){
        // clamp pan
        const maxPan = maxPanForScale(scale);
        pan.x = clamp(pan.x, -maxPan.x, maxPan.x);
        pan.y = clamp(pan.y, -maxPan.y, maxPan.y);
        // use translate then scale (keep transform-origin center)
        photoInner.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${scale})`;
      }

      function setScale(newScale, keepCenter = true){
        // keepCenter = true tries to hold viewer center stable under zoom
        newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
        if (keepCenter && newScale !== scale){
          // compute viewer center in page coordinates and adjust pan so center keeps same image point
          const viewerRect = viewer.getBoundingClientRect();
          const centerX = viewerRect.left + viewerRect.width/2;
          const centerY = viewerRect.top + viewerRect.height/2;

          // convert center to image-space (relative to image center)
          const dx = centerX - (viewerRect.left + viewerRect.width/2) - pan.x;
          const dy = centerY - (viewerRect.top + viewerRect.height/2) - pan.y;

          // ratio change
          const ratio = newScale / scale;
          pan.x = (pan.x - dx) * ratio + dx;
          pan.y = (pan.y - dy) * ratio + dy;
        }
        scale = newScale;
        applyTransform();
      }

      function zoomBy(delta){
        setScale(scale + delta);
      }

      function resetView(){
        scale = 1;
        pan.x = 0; pan.y = 0;
        fitToViewer = false;
        toggleFitBtn.setAttribute('aria-pressed','false');
        applyTransform();
      }

      function fitImage(){
        updateContainerSize();
        updateNaturalSize();
        // compute scale that fits the image entirely in viewer
        const s = Math.min(containerSize.w / imgNatural.w, containerSize.h / imgNatural.h);
        scale = clamp(s, MIN_SCALE, MAX_SCALE);
        pan.x = 0; pan.y = 0;
        applyTransform();
      }

      // Dragging to pan
      photoInner.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        dragging = true;
        photoInner.setPointerCapture(e.pointerId);
        dragStart.x = e.clientX; dragStart.y = e.clientY;
        dragStart.panX = pan.x; dragStart.panY = pan.y;
      });
      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        e.preventDefault();
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        pan.x = dragStart.panX + dx;
        pan.y = dragStart.panY + dy;
        applyTransform();
      });
      window.addEventListener('pointerup', (e) => {
        if (!dragging) return;
        dragging = false;
        try { photoInner.releasePointerCapture(e.pointerId) } catch(_) {}
      });

      // Joystick interaction
      joystick.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        joyActive = true;
        joystick.setPointerCapture(e.pointerId);
        updateJoyVectorFromEvent(e);
        startRafLoop();
      });
      joystick.addEventListener('pointermove', (e) => {
        if (!joyActive) return;
        e.preventDefault();
        updateJoyVectorFromEvent(e);
      });
      joystick.addEventListener('pointerup', (e) => {
        joyActive = false;
        joyVec.x = 0; joyVec.y = 0;
        knob.style.transform = `translate(0px,0px)`;
        try { joystick.releasePointerCapture(e.pointerId) } catch(_) {}
      });
      joystick.addEventListener('pointercancel', () => {
        joyActive = false;
        joyVec.x = 0; joyVec.y = 0;
        knob.style.transform = `translate(0px,0px)`;
      });

      function updateJoyVectorFromEvent(e){
        const rect = joystick.getBoundingClientRect();
        const cx = rect.left + rect.width/2;
        const cy = rect.top + rect.height/2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const maxR = rect.width/2 - 6; // leave margin
        const dist = Math.hypot(dx,dy);
        const nx = dx / Math.max(dist,1);
        const ny = dy / Math.max(dist,1);
        const strength = clamp(dist / maxR, 0, 1);
        joyVec.x = nx * strength;
        joyVec.y = ny * strength;
        // move knob visually
        const knobX = joyVec.x * (maxR * 0.6);
        const knobY = joyVec.y * (maxR * 0.6);
        knob.style.transform = `translate(${knobX}px, ${knobY}px)`;
      }

      function startRafLoop(){
        if (raf) return;
        let last = performance.now();
        function frame(now){
          const dt = (now - last) / 16.67; // ~60fps units
          last = now;
          // if joystick active and scale>1, pan the image
          if ((joyVec.x !== 0 || joyVec.y !== 0) && scale > 1.01){
            // speed scales with how much we're zoomed in
            const zoomFactor = (scale - 1) / (MAX_SCALE - 1);
            pan.x += -joyVec.x * JOY_SPEED * (1 + 3*zoomFactor) * dt;
            pan.y += -joyVec.y * JOY_SPEED * (1 + 3*zoomFactor) * dt;
            applyTransform();
          }
          raf = requestAnimationFrame(frame);
        }
        raf = requestAnimationFrame(frame);
      }

      // Buttons
      zoomInBtn.addEventListener('click', () => zoomBy(ZOOM_STEP));
      zoomOutBtn.addEventListener('click', () => zoomBy(-ZOOM_STEP));
      resetBtn.addEventListener('click', resetView);
      toggleFitBtn.addEventListener('click', () => {
        fitToViewer = !fitToViewer;
        toggleFitBtn.setAttribute('aria-pressed', String(fitToViewer));
        if (fitToViewer) fitImage(); else resetView();
      });

      // Keyboard
      window.addEventListener('keydown', (e) => {
        if (e.key === '+' || e.key === '=' ){ zoomBy(ZOOM_STEP); e.preventDefault(); }
        if (e.key === '-' || e.key === '_' ){ zoomBy(-ZOOM_STEP); e.preventDefault(); }
        if (e.key === 'ArrowLeft'){ pan.x += KEY_PAN_STEP; applyTransform(); e.preventDefault(); }
        if (e.key === 'ArrowRight'){ pan.x -= KEY_PAN_STEP; applyTransform(); e.preventDefault(); }
        if (e.key === 'ArrowUp'){ pan.y += KEY_PAN_STEP; applyTransform(); e.preventDefault(); }
        if (e.key === 'ArrowDown'){ pan.y -= KEY_PAN_STEP; applyTransform(); e.preventDefault(); }
        if (e.key.toLowerCase() === 'r'){ resetView(); e.preventDefault(); }
      });

      // Recompute sizes when image loads or window resizes
      function onImageLoaded(){
        updateNaturalSize();
        updateContainerSize();
        // start fit to viewer by default
        fitImage();
      }
      img.addEventListener('load', onImageLoaded);
      window.addEventListener('resize', () => {
        updateContainerSize();
        if (fitToViewer) fitImage();
        applyTransform();
      });

      // Touch / pointer scrolling prevention when using joystick (handled)
      viewer.addEventListener('touchmove', (e) => {
        // allow custom behavior; don't block if not panning via our UI
      }, {passive:false});

      // initial attempt to set up (if image cached)
      if (img.complete && img.naturalWidth){
        onImageLoaded();
      }

      // Small accessibility enhancement: announce scale change via title on reset button
      function announceScale(){
        resetBtn.title = `Skalning: ${Math.round(scale*100)}%`;
      }
      // update on transform changes (naive but fine)
      const originalApplyTransform = applyTransform;
      applyTransform = function(){
        const maxPan = maxPanForScale(scale);
        pan.x = clamp(pan.x, -maxPan.x, maxPan.x);
        pan.y = clamp(pan.y, -maxPan.y, maxPan.y);
        photoInner.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${scale})`;
        announceScale();
      };

    })();
  </script>
</body>
</html>
    });
  </script>
</body>
</html>
